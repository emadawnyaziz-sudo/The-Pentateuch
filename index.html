        const container = document.getElementById('app-content');

            let bookHTML = `
                <div class="book-container">
                    <h2 class="book-title">${book.name}</h2>
                    <div class="book-summary">${book.summary}</div>
            `;

            book.chapters.forEach((chapter, index) => {
                let chNum = index + 1;
                
                bookHTML += `
                    <div class="chapter-row">
                        <div class="chapter-info">
                            <div class="chapter-title">${chapter.title}</div>
                            <div class="chapter-name">${chapter.name}</div>
                        </div>
                        <div class="actions">
                            <label class="checkbox-container">
                                <input type="checkbox" id="${chapter.id}" onchange="saveProgress('${chapter.id}')">
                                <span>قريت الإصحاح ده ✓</span>
                            </label>
                        </div>
                    </div>
                `;

                if (book.questions[chNum]) {
                    bookHTML += `
                        <div class="questions-block">
                            <h3>أسئلة دراسية (إصحاح 1 لـ ${chNum}) 👇</h3>
                    `;
                    book.questions[chNum].forEach((q, qIndex) => {
                        let qId = `${book.id}_q_${chNum}_${qIndex}`;
                        bookHTML += `
                            <div class="q-item">
                                <div class="q-text">${q}</div>
                                <textarea id="${qId}" placeholder="اكتب إجابتك هنا..."></textarea>
                                <button id="btn_${qId}" class="btn-save-ans" onclick="saveAnswer('${qId}')">احفظ إجابتك</button>
                            </div>
                        `;
                    });
                    bookHTML += `</div>`;
                }
            });

            if (book.questions["final"]) {
                bookHTML += `
                    <div class="questions-block final-block">
                        <h3>أسئلة دراسية لختام سفر ${book.name} ✨</h3>
                `;
                book.questions["final"].forEach((q, qIndex) => {
                    let qId = `${book.id}_q_final_${qIndex}`;
                    bookHTML += `
                        <div class="q-item">
                            <div class="q-text">${q}</div>
                            <textarea id="${qId}" placeholder="اكتب إجابتك هنا..."></textarea>
                            <button id="btn_${qId}" class="btn-save-ans" onclick="saveAnswer('${qId}')">احفظ إجابتك</button>
                        </div>
                    `;
                });
                bookHTML += `</div>`;

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                console.error("خطأ في تسجيل الدخول: ", error);
                alert("حصلت مشكلة في الدخول.. اتأكد إنك مفعل Google Auth في الفايربيز.");
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                const userInfo = document.getElementById('userInfo');
                userInfo.style.display = 'block';
                userInfo.innerText = `أهلاً بيك يا ${user.displayName}.. تقدر دلوقتي تحفظ إجاباتك!`;
                
                loadUserProgress(user.uid);
            } else {
                document.getElementById('loginBtn').style.display = 'inline-block';
                document.getElementById('userInfo').style.display = 'none';
            }
        });

        function saveProgress(chapterId) {
            const user = auth.currentUser;
            if (user) {
                const isChecked = document.getElementById(chapterId).checked;
                db.collection('userProgress').doc(user.uid).set({
                    [chapterId]: isChecked
                }, { merge: true }).catch(error => console.error(error));
            } else {
                alert('يا ريت تسجل دخول الأول بالجيميل عشان نحفظ قرايتك!');
                document.getElementById(chapterId).checked = false;
            }
        }

        function saveAnswer(qId) {
            const user = auth.currentUser;
            const btn = document.getElementById(`btn_${qId}`);
            
            if (!user) {
                alert('يا ريت تسجل دخول الأول عشان نحفظ إجاباتك!');
                return;
            }

            const answerText = document.getElementById(qId).value;
            
            btn.innerText = "بيحفظ...";
            btn.style.opacity = "0.7";

            db.collection('userAnswers').doc(user.uid).set({
                [qId]: answerText
            }, { merge: true }).then(() => {
                btn.innerText = "اتحفظت ✓";
                btn.style.backgroundColor = "#27ae60";
                btn.style.opacity = "1";
                
                setTimeout(() => {
                    btn.innerText = "احفظ إجابتك";
                    btn.style.backgroundColor = "#f39c12";
                }, 2000);
            }).catch((error) => {
                console.error("خطأ في الحفظ: ", error);
                btn.innerText = "فشل الحفظ ❌";
                btn.style.backgroundColor = "#c0392b";
            });
        }

        function loadUserProgress(uid) {
            db.collection('userProgress').doc(uid).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    for (const chapterId in data) {
                        const checkbox = document.getElementById(chapterId);
                        if (checkbox) checkbox.checked = data[chapterId];
                    }
                }
            });

            db.collection('userAnswers').doc(uid).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    for (const qId in data) {
                        const textarea = document.getElementById(qId);
                        if (textarea) textarea.value = data[qId];
                    }
                }
            });
        }
